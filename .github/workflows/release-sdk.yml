name: Release SDK and TPM

# Configure a crates.io Trusted Publisher for BOTH library crates:
# owner Azure, repository azure-guest-attestation-sdk,
# workflow release-sdk.yml, environment crates-io.
# Push azure-guest-attestation-sdk-v<VERSION> from release/<MAJOR>.<MINOR>.x,
# then approve the crates-io deployment. No stored Cargo API token is needed.
on:
  pull_request:
    paths:
      - '.github/workflows/release-sdk.yml'
      - 'scripts/publish-crate.sh'
      - 'scripts/test-publish-crate.sh'
      - 'scripts/README.md'
  push:
    tags:
      - 'azure-guest-attestation-sdk-v*'

permissions:
  contents: read

concurrency:
  group: release-sdk-${{ github.event.pull_request.number || 'publish' }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUSTUP_TOOLCHAIN: 1.99.0

jobs:
  workflow-checks:
    name: Validate release tooling
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install checksum-pinned actionlint
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          curl --fail --silent --show-error --location --retry 3 \
            --connect-timeout 10 --max-time 60 \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz \
            --output actionlint.tar.gz
          echo '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  actionlint.tar.gz' \
            | sha256sum --check
          tar -xzf actionlint.tar.gz actionlint
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - run: |
          actionlint .github/workflows/release-sdk.yml
          bash -n scripts/publish-crate.sh scripts/test-publish-crate.sh
          shellcheck scripts/publish-crate.sh scripts/test-publish-crate.sh
          bash scripts/test-publish-crate.sh

  version:
    name: Verify release source
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Verify tag, versions, and maintenance line
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#azure-guest-attestation-sdk-v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid SDK release version: $version" >&2
            exit 1
          fi
          for crate in azure-tpm azure-guest-attestation-sdk; do
            actual=$(grep -m1 '^version = ' "crates/$crate/Cargo.toml" | cut -d'"' -f2)
            if [[ "$actual" != "$version" ]]; then
              echo "::error::$crate version $actual does not match tag $version" >&2
              exit 1
            fi
          done
          branch="release/${version%.*}.x"
          git fetch --no-tags origin "refs/heads/$branch:refs/remotes/origin/$branch"
          if ! git merge-base --is-ancestor HEAD "origin/$branch"; then
            echo "::error::Release commit must belong to $branch" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  validate:
    name: Validate (${{ matrix.os }})
    needs: version
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@ff7f6a3374ce205788da40198ec918bd5d67aea7 # 1.99.0
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Install Strawberry Perl (Windows)
        if: runner.os == 'Windows'
        run: choco install strawberryperl --no-progress -y
      - uses: taiki-e/install-action@37f7c5781271959fb65b6b35224e28652ff2b63d # v2.87.0
        with:
          tool: cargo-nextest@0.9.150
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - name: Reference-TPM tests
        run: cargo nextest run -p azure-guest-attestation-sdk
        env:
          RUSTFLAGS: --cfg vtpm_tests
  release-checks:
    name: MSRV, docs, coverage, and dependencies
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@ff7f6a3374ce205788da40198ec918bd5d67aea7 # 1.99.0
        with:
          components: llvm-tools-preview
      - name: Install MSRV toolchain
        run: rustup toolchain install 1.90 --profile minimal
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: taiki-e/install-action@5488ac5a951645ce95062214902ac4b6bc1a1037 # v2
        with:
          tool: cargo-llvm-cov, cargo-audit, cargo-deny
      - run: cargo +1.90 check --workspace
      - run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: -Dwarnings
      - name: Coverage
        run: |
          cargo llvm-cov --workspace \
            --ignore-filename-regex '(src/lib\.rs|azure-guest-attest/src/main\.rs)$' \
            --fail-under-lines 60
        env:
          RUSTFLAGS: --cfg vtpm_tests
      - run: cargo audit
      - run: cargo deny check

  publish:
    name: Publish to crates.io
    if: github.event_name == 'push'
    needs: [workflow-checks, version, validate, release-checks]
    runs-on: ubuntu-latest
    environment: crates-io
    permissions:
      contents: read
      id-token: write
    env:
      RELEASE_VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@ff7f6a3374ce205788da40198ec918bd5d67aea7 # 1.99.0
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Package and verify both library crates
        run: |
          set -euo pipefail
          cargo package -p azure-tpm -p azure-guest-attestation-sdk --locked
          mkdir -p target/release-artifacts
          for crate in azure-tpm azure-guest-attestation-sdk; do
            cp "target/package/$crate-$RELEASE_VERSION.crate" target/release-artifacts/
          done
          (
            cd target/release-artifacts
            sha256sum "azure-tpm-$RELEASE_VERSION.crate" \
              "azure-guest-attestation-sdk-$RELEASE_VERSION.crate" > SHA256SUMS
            sha256sum --check SHA256SUMS
          )
      - name: Retain verified release archives
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verified-sdk-crates-${{ github.ref_name }}
          path: target/release-artifacts/
          if-no-files-found: error
          retention-days: 90
      - name: Authenticate to crates.io
        id: auth
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6
      - name: Publish azure-tpm
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          bash scripts/publish-crate.sh azure-tpm "$RELEASE_VERSION" \
            "target/release-artifacts/azure-tpm-$RELEASE_VERSION.crate"
      - name: Publish azure-guest-attestation-sdk
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          bash scripts/publish-crate.sh azure-guest-attestation-sdk "$RELEASE_VERSION" \
            "target/release-artifacts/azure-guest-attestation-sdk-$RELEASE_VERSION.crate"
