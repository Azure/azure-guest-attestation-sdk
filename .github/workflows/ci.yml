name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings

jobs:
  # --------------------------------------------------------------------------
  # Detect which files changed so we can skip expensive jobs on doc-only PRs.
  # Uses dorny/paths-filter — the de-facto standard for path-based filtering.
  # Skipped jobs still satisfy GitHub required-status-check rules.
  # --------------------------------------------------------------------------
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            code:
              - 'crates/**'
              - 'tools/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'
              - '.github/workflows/ci.yml'

  # --------------------------------------------------------------------------
  # Format check (fast, always runs)
  # --------------------------------------------------------------------------
  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  # --------------------------------------------------------------------------
  # Clippy lint (per-platform, skipped on doc-only changes)
  # --------------------------------------------------------------------------
  clippy:
    name: Clippy (${{ matrix.os }})
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.code == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo clippy --workspace --all-targets -- -D warnings

  # --------------------------------------------------------------------------
  # Build + unit tests (no vTPM, skipped on doc-only changes)
  # --------------------------------------------------------------------------
  test:
    name: Test (${{ matrix.os }})
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.code == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo build --workspace
      - run: cargo test --workspace

  # --------------------------------------------------------------------------
  # Offline verifier (`verify` feature — OpenSSL on Linux, CNG/crypt32 on
  # Windows; skipped on doc-only changes). The default CI jobs never build this
  # path, so lint + test it explicitly here.
  # --------------------------------------------------------------------------
  verify:
    name: Verify feature (${{ matrix.os }})
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.code == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo clippy -p azure-guest-attestation-sdk --no-default-features --features native,verify --all-targets -- -D warnings
      - run: cargo clippy -p azure-guest-local-verify --all-targets -- -D warnings
      - run: cargo test -p azure-guest-attestation-sdk --no-default-features --features native,verify
      - run: cargo build -p azure-guest-local-verify

  # --------------------------------------------------------------------------
  # Explicit SymCrypt provider, without platform-crypto or RustCrypto fallback.
  # Native distributions are pinned independently of the Rust wrapper crates.
  # --------------------------------------------------------------------------
  symcrypt:
    name: SymCrypt (${{ matrix.os }})
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.code == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, windows-2022]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: symcrypt
      - name: Provision SymCrypt 103.13.0 (Linux x64)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          native="$RUNNER_TEMP/symcrypt"
          mkdir -p "$native"
          curl --fail --location --retry 3 \
            https://github.com/microsoft/SymCrypt/releases/download/v103.13.0/symcrypt-linux-generic-amd64-release-103.13.0-286762b.tar.gz \
            -o "$native/symcrypt.tar.gz"
          echo "c3aa92e01a3c15e33b54ca3d5e49b62076a72d4e84b3b80e2f8f4d6877427269  $native/symcrypt.tar.gz" | sha256sum --check
          tar -xzf "$native/symcrypt.tar.gz" -C "$native"
          echo "LIBRARY_PATH=$native/lib" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$native/lib" >> "$GITHUB_ENV"
      - name: Provision SymCrypt 103.13.0 (Windows x64)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $native = Join-Path $env:RUNNER_TEMP symcrypt
          New-Item -ItemType Directory -Force $native | Out-Null
          $archive = Join-Path $native symcrypt.zip
          Invoke-WebRequest `
            https://github.com/microsoft/SymCrypt/releases/download/v103.13.0/symcrypt-windows-amd64-release-103.13.0-286762b7.zip `
            -OutFile $archive
          if ((Get-FileHash $archive -Algorithm SHA256).Hash -ne
              '90ea7631331d23a43e0abc7f7af89b44bda67cfa183a70a8b76d988d9d3036b8') {
            throw 'SymCrypt archive checksum mismatch'
          }
          Expand-Archive $archive -DestinationPath $native
          $dll = Get-ChildItem $native -Recurse -Filter symcrypt.dll
          if (@($dll).Count -ne 1) { throw 'Expected exactly one SymCrypt DLL' }
          "SYMCRYPT_LIB_PATH=$($dll.DirectoryName)" >> $env:GITHUB_ENV
          $dll.DirectoryName >> $env:GITHUB_PATH
          foreach ($directory in @('target/debug', 'target/debug/deps')) {
            New-Item -ItemType Directory -Force $directory | Out-Null
            Copy-Item $dll.FullName "$directory/symcrypt.dll" -Force
          }
      - run: cargo check -p azure-guest-attestation-sdk --no-default-features --features symcrypt
      - run: cargo clippy --workspace --no-default-features --features symcrypt --all-targets -- -D warnings
      - run: cargo test --workspace --no-default-features --features symcrypt
      - run: cargo build --workspace --no-default-features --features symcrypt
      - run: cargo run -p azure-guest-local-verify --no-default-features --features symcrypt -- tdx crates/azure-guest-attestation-sdk/src/verify/testdata/tdx_v5_servicetd_quote.bin --json
      - name: Install reference-TPM prerequisites (Windows)
        if: runner.os == 'Windows'
        run: choco install strawberryperl --no-progress -y
      - uses: taiki-e/install-action@37f7c5781271959fb65b6b35224e28652ff2b63d # v2.87.0
        with:
          tool: cargo-nextest@0.9.150
      - name: SymCrypt reference-TPM integration
        run: cargo nextest run -p azure-guest-attestation-sdk --no-default-features --features symcrypt,verify
        env:
          RUSTFLAGS: --cfg vtpm_tests
      - name: Reject mixed providers and verify without an offline backend
        shell: pwsh
        run: |
          foreach ($features in @('symcrypt,native', 'symcrypt,rustcrypto', 'rustcrypto,verify', 'verify')) {
            $output = & cargo check -p azure-guest-attestation-sdk --no-default-features --features $features 2>&1
            if ($LASTEXITCODE -eq 0) { throw "Unexpectedly accepted features: $features" }
            if (($output -join "`n") -notmatch 'cannot be combined|requires.*backend|requires.*rustcrypto') {
              throw "Unexpected failure for ${features}: $output"
            }
          }
          $global:LASTEXITCODE = 0
      - name: Audit production dependency graph
        shell: pwsh
        run: |
          $graph = & cargo tree --workspace --no-default-features --features symcrypt --edges normal,build --prefix none --format '{p}'
          if ($LASTEXITCODE -ne 0) { throw 'Cannot inspect production dependencies' }
          $forbidden = '^(aes-gcm|sha1|sha2|ring|aws-lc-rs|aws-lc-sys|openssl|openssl-sys|native-tls|schannel|cng) v'
          $found = $graph | Select-String $forbidden
          if ($found) { throw "Unexpected cryptographic provider: $found" }
      - name: Audit native imports (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          for binary in target/debug/azure-guest-attest target/debug/azure-guest-attest-web \
              target/debug/azure-guest-local-verify target/debug/azure-tpm-tool \
              "$LD_LIBRARY_PATH/libsymcrypt.so"; do
            imports=$(readelf -d "$binary")
            echo "$imports"
            if echo "$imports" | grep -E 'NEEDED.*\[(libssl|libcrypto)\.'; then
              echo "Unexpected OpenSSL import: $binary" >&2
              exit 1
            fi
          done
      - name: Audit native imports (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $dumpbin = & $vswhere -latest -products '*' -find 'VC\Tools\MSVC\**\bin\Hostx64\x64\dumpbin.exe' | Select-Object -First 1
          if (!$dumpbin) { throw 'Cannot locate dumpbin for native import audit' }
          foreach ($binary in @('target/debug/azure-guest-attest.exe', 'target/debug/azure-guest-attest-web.exe',
              'target/debug/azure-guest-local-verify.exe', 'target/debug/azure-tpm-tool.exe', "$env:SYMCRYPT_LIB_PATH/symcrypt.dll")) {
            $imports = & $dumpbin /imports $binary
            if ($LASTEXITCODE -ne 0) { throw "Cannot inspect $binary" }
            $imports
            $cryptoCalls = $imports | Select-String '\b(BCrypt\w*|NCrypt\w*|Crypt[A-Z]\w*|Cert[A-Z]\w*|AcquireCredentialsHandle\w*|InitializeSecurityContext\w*|AcceptSecurityContext\w*)'
            $forbidden = $cryptoCalls | Where-Object { $_ -notmatch 'BCryptGenRandom|\.dll\s*$' }
            if ($forbidden) { throw "Unexpected platform crypto fallback: $forbidden" }
          }
      - name: Missing native runtime fails closed (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set +e
          env -u LD_LIBRARY_PATH target/debug/azure-guest-attest --version > "$RUNNER_TEMP/missing-symcrypt.log" 2>&1
          status=$?
          set -e
          cat "$RUNNER_TEMP/missing-symcrypt.log"
          test "$status" -eq 127
          grep -q 'libsymcrypt' "$RUNNER_TEMP/missing-symcrypt.log"
      - name: App-local native runtime fails closed (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Add-Type @'
          using System.Runtime.InteropServices;
          public static class SymCryptLoaderProbe {
            [DllImport("kernel32.dll")]
            public static extern uint SetErrorMode(uint mode);
          }
          '@
          $isolated = Join-Path $env:RUNNER_TEMP missing-symcrypt
          New-Item -ItemType Directory -Force $isolated | Out-Null
          Copy-Item target/debug/azure-guest-attest.exe "$isolated/probe.exe"
          $nativeDll = Join-Path $env:SYMCRYPT_LIB_PATH symcrypt.dll
          $appDll = Join-Path $isolated symcrypt.dll
          Copy-Item -LiteralPath $nativeDll -Destination $appDll
          $cases = @('valid', 'invalid')
          # Windows-latest ships SymCrypt; genuine absence is tested on 2022.
          if ('${{ matrix.os }}' -eq 'windows-2022') { $cases += 'missing' }
          $oldMode = [SymCryptLoaderProbe]::SetErrorMode(0x8003)
          try {
            foreach ($case in $cases) {
              if ($case -eq 'invalid') { [System.IO.File]::WriteAllBytes($appDll, [byte[]]@(0)) }
              if ($case -eq 'missing') { Remove-Item -LiteralPath $appDll }
              $start = [System.Diagnostics.ProcessStartInfo]::new("$isolated/probe.exe", '--version')
              $start.UseShellExecute = $false
              $start.WorkingDirectory = $isolated
              $start.Environment['PATH'] = "$env:SystemRoot\System32;$env:SystemRoot"
              $process = [System.Diagnostics.Process]::Start($start)
              try {
                if (!$process.WaitForExit(10000)) {
                  $process.Kill()
                  throw 'Native runtime probe did not terminate'
                }
                $expected = switch ($case) {
                  'valid' { 0 }
                  'invalid' { -1073741701; -1073741521 }
                  'missing' { -1073741515 }
                }
                if ($process.ExitCode -notin $expected) {
                  $ambient = @("$env:SystemRoot\System32\symcrypt.dll", "$env:SystemRoot\symcrypt.dll") |
                    Where-Object { Test-Path -LiteralPath $_ }
                  throw "Expected $case loader status $expected, got $($process.ExitCode); ambient DLLs: $ambient"
                }
                "SymCrypt $case loader status: $($process.ExitCode)"
              } finally {
                $process.Dispose()
              }
            }
          } finally {
            [SymCryptLoaderProbe]::SetErrorMode($oldMode) | Out-Null
            if (Test-Path -LiteralPath $appDll) { Remove-Item -LiteralPath $appDll }
            Remove-Item "$isolated/probe.exe"
          }
      - name: SymCrypt MSRV (Linux)
        if: runner.os == 'Linux'
        run: |
          rustup toolchain install 1.90 --profile minimal
          cargo +1.90 check --workspace --no-default-features --features symcrypt

  # --------------------------------------------------------------------------
  # vTPM integration tests (skipped on doc-only changes)
  # --------------------------------------------------------------------------
  vtpm-tests:
    name: vTPM tests (${{ matrix.os }})
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.code == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      # Perl is pre-installed on GitHub runners, but ensure Strawberry Perl
      # is available on Windows for the vendored OpenSSL build.
      - name: Install Strawberry Perl (Windows)
        if: runner.os == 'Windows'
        run: choco install strawberryperl --no-progress -y

      - name: Install cargo-nextest
        uses: taiki-e/install-action@37f7c5781271959fb65b6b35224e28652ff2b63d # v2.87.0
        with:
          tool: cargo-nextest@0.9.150

      - name: Run vTPM tests (nextest)
        run: cargo nextest run -p azure-guest-attestation-sdk
        env:
          RUSTFLAGS: --cfg vtpm_tests

  # --------------------------------------------------------------------------
  # MSRV check (skipped on doc-only changes)
  # --------------------------------------------------------------------------
  msrv:
    name: MSRV (Rust 1.90)
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@06e5a564a0556e338780f5aecf2e7dcc9b267f07 # 1.90
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo check --workspace

  # --------------------------------------------------------------------------
  # Documentation build (skipped on doc-only changes — runs cargo doc)
  # --------------------------------------------------------------------------
  docs:
    name: Docs
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -Dwarnings
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo doc --workspace --no-deps

  # --------------------------------------------------------------------------
  # Code coverage (skipped on doc-only changes)
  # --------------------------------------------------------------------------
  coverage:
    name: Code Coverage
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov
      - name: Run tests and check coverage threshold
        env:
          RUSTFLAGS: --cfg vtpm_tests
        run: |
          cargo llvm-cov --workspace \
            --ignore-filename-regex '(src/lib\.rs|azure-guest-attest/src/main\.rs)$' \
            --fail-under-lines 60

  # --------------------------------------------------------------------------
  # Security audit — check dependencies for known vulnerabilities
  # --------------------------------------------------------------------------
  audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  # --------------------------------------------------------------------------
  # Dependency linting — license compliance & duplicate detection
  # --------------------------------------------------------------------------
  deny:
    name: cargo deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@stable
      # Install the cargo-deny binary directly (prebuilt) instead of the
      # Docker-based cargo-deny-action, whose image build is flaky in CI.
      - uses: taiki-e/install-action@37f7c5781271959fb65b6b35224e28652ff2b63d # v2.87.0
        with:
          tool: cargo-deny
      - run: cargo deny check
