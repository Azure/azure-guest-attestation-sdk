name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings

jobs:
  # --------------------------------------------------------------------------
  # Detect which files changed so we can skip expensive jobs on doc-only PRs.
  # Uses dorny/paths-filter — the de-facto standard for path-based filtering.
  # Skipped jobs still satisfy GitHub required-status-check rules.
  # --------------------------------------------------------------------------
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            code:
              - 'crates/**'
              - 'tools/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'
              - '.github/workflows/ci.yml'

  # --------------------------------------------------------------------------
  # Format check (fast, always runs)
  # --------------------------------------------------------------------------
  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  # --------------------------------------------------------------------------
  # Clippy lint (per-platform, skipped on doc-only changes)
  # --------------------------------------------------------------------------
  clippy:
    name: Clippy (${{ matrix.os }})
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.code == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo clippy --workspace --all-targets -- -D warnings

  # --------------------------------------------------------------------------
  # Build + unit tests (no vTPM, skipped on doc-only changes)
  # --------------------------------------------------------------------------
  test:
    name: Test (${{ matrix.os }})
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.code == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo build --workspace
      - run: cargo test --workspace

  # --------------------------------------------------------------------------
  # Offline verifier (`verify` feature — OpenSSL on Linux, CNG/crypt32 on
  # Windows; skipped on doc-only changes). The default CI jobs never build this
  # path, so lint + test it explicitly here.
  # --------------------------------------------------------------------------
  verify:
    name: Verify feature (${{ matrix.os }})
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.code == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy -p azure-guest-attestation-sdk --no-default-features --features verify --all-targets -- -D warnings
      - run: cargo clippy -p azure-guest-local-verify --all-targets -- -D warnings
      - run: cargo test -p azure-guest-attestation-sdk --no-default-features --features verify
      - run: cargo build -p azure-guest-local-verify

  # --------------------------------------------------------------------------
  # vTPM integration tests (skipped on doc-only changes)
  # --------------------------------------------------------------------------
  vtpm-tests:
    name: vTPM tests (${{ matrix.os }})
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.code == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      # Perl is pre-installed on GitHub runners, but ensure Strawberry Perl
      # is available on Windows for the vendored OpenSSL build.
      - name: Install Strawberry Perl (Windows)
        if: runner.os == 'Windows'
        run: choco install strawberryperl --no-progress -y

      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest

      - name: Run vTPM tests (nextest)
        run: cargo nextest run -p azure-guest-attestation-sdk
        env:
          RUSTFLAGS: --cfg vtpm_tests

  # --------------------------------------------------------------------------
  # MSRV check (skipped on doc-only changes)
  # --------------------------------------------------------------------------
  msrv:
    name: MSRV (Rust 1.90)
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@06e5a564a0556e338780f5aecf2e7dcc9b267f07 # 1.90
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo check --workspace

  # --------------------------------------------------------------------------
  # Documentation build (skipped on doc-only changes — runs cargo doc)
  # --------------------------------------------------------------------------
  docs:
    name: Docs
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -Dwarnings
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo doc --workspace --no-deps

  # --------------------------------------------------------------------------
  # Code coverage (skipped on doc-only changes)
  # --------------------------------------------------------------------------
  coverage:
    name: Code Coverage
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov
      - name: Run tests and check coverage threshold
        env:
          RUSTFLAGS: --cfg vtpm_tests
        run: |
          cargo llvm-cov --workspace \
            --ignore-filename-regex '(src/lib\.rs|azure-guest-attest/src/main\.rs)$' \
            --fail-under-lines 60

  # --------------------------------------------------------------------------
  # Security audit — check dependencies for known vulnerabilities
  # --------------------------------------------------------------------------
  audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  # --------------------------------------------------------------------------
  # Dependency linting — license compliance & duplicate detection
  # --------------------------------------------------------------------------
  deny:
    name: cargo deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@stable
      # Install the cargo-deny binary directly (prebuilt) instead of the
      # Docker-based cargo-deny-action, whose image build is flaky in CI.
      - uses: taiki-e/install-action@37f7c5781271959fb65b6b35224e28652ff2b63d # v2.87.0
        with:
          tool: cargo-deny
      - run: cargo deny check
