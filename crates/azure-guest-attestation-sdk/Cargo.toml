[package]
name = "azure-guest-attestation-sdk"
version = "0.2.0"
description = "Azure Guest Attestation SDK - TPM 2.0 and TEE attestation for CVM and TrustedLaunch VMs"
documentation = "https://docs.rs/azure-guest-attestation-sdk"
readme = "README.md"
keywords = ["azure", "attestation", "tpm", "confidential-vm", "tee"]
categories = ["cryptography", "hardware-support", "api-bindings"]

# Inherit from workspace
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true

[lib]
name = "azure_guest_attestation_sdk"

[dependencies]
azure-tpm = { path = "../azure-tpm", version = "0.2.0", default-features = false }
bitfield-struct = "0.6"

# Workspace dependencies
base64.workspace = true
serde.workspace = true
serde_json.workspace = true
hex.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
aes-gcm = { workspace = true, optional = true }
x509-parser = { version = "0.16", optional = true }
symcrypt = { workspace = true, optional = true }
rustls-symcrypt = { workspace = true, optional = true }
rustls = { workspace = true, optional = true }
webpki = { workspace = true, optional = true }
webpki-roots = { workspace = true, optional = true }
der = { version = "0.7", optional = true }

# HTTP. TLS backend is feature-selected: `rustls-tls` (default) or `native-tls`.
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys.workspace = true

# `native` crypto backend on Linux links the system OpenSSL (dynamic).
[target.'cfg(target_os = "linux")'.dependencies]
openssl = { version = "0.10", optional = true }

[features]
# Portable pure-Rust crypto + rustls TLS (default; published to crates.io).
default = ["rustcrypto"]
rustcrypto = ["dep:aes-gcm", "reqwest/rustls-tls", "azure-tpm/rustcrypto"]
# Platform crypto + native-tls: OpenSSL (Linux) / SChannel + CNG (Windows).
# Used by the shipped CLI so the binary carries no RustCrypto/ring crates.
# Build with `--no-default-features --features native`.
native = ["dep:openssl", "reqwest/native-tls", "azure-tpm/native"]
symcrypt = ["dep:symcrypt", "dep:rustls-symcrypt", "dep:rustls", "dep:webpki", "dep:webpki-roots", "dep:der", "reqwest/rustls-tls-manual-roots-no-provider", "azure-tpm/symcrypt"]
# Local (offline) DCAP-style attestation verification (ECDSA + X.509 chain
# validation). Select `native` or `symcrypt` explicitly.
verify = ["dep:x509-parser"]

[lints]
workspace = true

[dev-dependencies]
num-bigint = "0.4"
injectorpp = "0.5.0"
sha2.workspace = true
rand.workspace = true
rcgen = { version = "0.13", default-features = false, features = ["pem"] }
yasna = "0.5"

# Reference-TPM test harness. Gated behind `--cfg vtpm_tests` so the heavy
# git-sourced `ms-tpm-20-ref` (vendored OpenSSL) never enters the default
# build/test graph. Enable with: RUSTFLAGS="--cfg vtpm_tests".
[target.'cfg(vtpm_tests)'.dev-dependencies]
# The SDK's azure-tpm edge supplies the selected backend through unification.
azure-tpm-testkit = { path = "../azure-tpm-testkit", default-features = false }
